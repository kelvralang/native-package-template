name: Package CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: package-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    uses: kelvralang/package-actions/.github/workflows/native-ci.yml@v2
    with:
      package_name: native-package-template
      runtime_ref: main
      targets: '["linux-x86_64-gnu","linux-arm64-gnu","macos-arm64"]'
      test_fixture: tests/project.kel.toml.in
